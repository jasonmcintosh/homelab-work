apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-nolock
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: nfs.csi.k8s.io
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  mountPermissions: "0777" 
  server: truenas.mcintosh.farm
  share: /mnt/Main/K8sData
  #Optional: Adds subdirectories inside your main share for organization
  subDir: "${pvc.metadata.namespace}-${pvc.metadata.name}" 
reclaimPolicy: Delete
mountOptions:
  - hard
  - nfsvers=4.1
  - nolock
  - noatime
  - nointr
  - tcp
  - rw
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-default
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: nfs.csi.k8s.io
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  mountPermissions: "0777" 
  server: truenas.mcintosh.farm
  share: /mnt/Main/K8sData
  #Optional: Adds subdirectories inside your main share for organization
  subDir: "${pvc.metadata.namespace}-${pvc.metadata.name}" 
reclaimPolicy: Delete
mountOptions:
  - hard
  - nfsvers=4.1
  - noatime
  - nointr
  - tcp

