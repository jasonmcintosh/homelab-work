ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    # Registry layer pushes exceed nginx's 1m default and fail with 413.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: gitea.mcintosh.farm
  tls:
    - hosts:
      - "*.mcintosh.farm"
      secretName: mcintosh-farm
postgresql-ha:
  persistence:
    storageClass: truenas-iscsi
  # The chart's "small" preset (384Mi) left no headroom: after enough crash-restarts pgpool's
  # container couldn't even start ("container init was OOM-killed", 2026-10-15). Same requests
  # and CPU as the preset, double the memory limit.
  pgpool:
    # Every query to the primary; the replicas are for failover only. With load balancing on, a read
    # straight after a write in another request (Docker checking a layer it just pushed, the runner
    # appending to a log it just created) could go to a replica that hadn't caught up: "unknown
    # blob" on an image push and "file does not exist" for action logs (2026-10-30).
    useLoadBalancing: false
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 375m
        memory: 768Mi
        ephemeral-storage: 2Gi
  # PostgreSQL had the same "small" preset (384Mi, 375m CPU): on 2026-10-23 a replica was
  # OOM-killed and the others failed their 5s probes under load (Renovate's first run), taking
  # Gitea down until they recovered. The primary sits near 340Mi on its own.
  postgresql:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 1000m
        memory: 1Gi
        ephemeral-storage: 2Gi
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 2Gi
