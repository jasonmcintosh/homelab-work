apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: runner
  name: runner
  namespace: gitea
spec:
  serviceName: runner
  replicas: 1
  selector:
    matchLabels:
      app: runner
  template:
    metadata:
      labels:
        app: runner
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 10800 # keep above runner.shutdown_timeout, see README
      volumes:
      - name: docker-socket
        emptyDir: {}
      initContainers:
      - name: docker
        image: docker:28.2.2-dind
        securityContext:
          privileged: true
        # Pod eth0 (calico vxlan) is MTU 1450 but docker bridges default to 1500,
        # which drops packets to some hosts (e.g. corretto.github.io) and hangs jobs.
        args:
        - --mtu=1400
        - --default-network-opt=bridge=com.docker.network.driver.mtu=1400
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run
        # Keeps the images pulled for jobs across restarts. Without this, the
        # daemon's data root is ephemeral and every job re-pulls its images.
        - name: docker-data
          mountPath: /var/lib/docker
        startupProbe:
          exec:
            command: ["/usr/bin/test", "-S", "/var/run/docker.sock"]
        livenessProbe:
          exec:
            command: ["/usr/bin/test", "-S", "/var/run/docker.sock"]
        restartPolicy: Always
      containers:
      - name: runner
        image: gitea/runner:nightly
        env:
        - name: GITEA_INSTANCE_URL
          value: https://gitea.mcintosh.farm
        - name: GITEA_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: runner-secret
              key: token
        volumeMounts:
        - name: runner-data
          mountPath: /data
        - name: docker-socket
          mountPath: /var/run
  volumeClaimTemplates:
  # The runner's working directory: the .runner registration file and, optionally,
  # the config file.
  - metadata:
      name: runner-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: truenas-iscsi
  # The Docker daemon's data root: the images pulled for jobs. Size it for the
  # images you expect to cache.
  - metadata:
      name: docker-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: truenas-iscsi
