apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-csi-controller
  namespace: kube-system
  labels:
    helm.sh/chart: truenas-csi-1.3.0
    app.kubernetes.io/name: truenas-csi
    app.kubernetes.io/instance: truenas-csi
    app.kubernetes.io/version: "1.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: truenas-csi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenas-csi-controller
  template:
    metadata:
      labels:
        app: truenas-csi-controller
        helm.sh/chart: truenas-csi-1.3.0
        app.kubernetes.io/name: truenas-csi
        app.kubernetes.io/instance: truenas-csi
        app.kubernetes.io/version: "1.3.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: truenas-csi
    spec:
      serviceAccountName: truenas-csi-controller-sa
      containers:
        - name: csi-controller
          image: ghcr.io/truenas/truenas-csi:v1.3.0
          imagePullPolicy: IfNotPresent
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--node-id=$(NODE_ID)"
            - "--mode=controller"
            - "--v=4"
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: TRUENAS_URL
              valueFrom:
                configMapKeyRef:
                  name: truenas-csi-config
                  key: truenasURL
            - name: TRUENAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: truneas-api-key
                  key: api-key
            - name: TRUENAS_DEFAULT_POOL
              valueFrom:
                configMapKeyRef:
                  name: truenas-csi-config
                  key: defaultPool
            - name: TRUENAS_NFS_SERVER
              valueFrom:
                configMapKeyRef:
                  name: truenas-csi-config
                  key: nfsServer
            - name: TRUENAS_ISCSI_PORTAL
              valueFrom:
                configMapKeyRef:
                  name: truenas-csi-config
                  key: iscsiPortal
            - name: TRUENAS_NVMEOF_PORTAL
              valueFrom:
                configMapKeyRef:
                  name: truenas-csi-config
                  key: nvmeofPortal
                  optional: true
            - name: TRUENAS_ISCSI_IQN_BASE
              valueFrom:
                configMapKeyRef:
                  name: truenas-csi-config
                  key: iscsiIQNBase
                  optional: true
            - name: TRUENAS_INSECURE_SKIP_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: truenas-csi-config
                  key: truenasInsecure
                  optional: true
            - name: TRUENAS_METRICS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: truenas-csi-config
                  key: metricsAddr
                  optional: true
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9808
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5

        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.1.1
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            # No Topology feature gate: the driver reports no accessible topology,
            # so there is nothing for the provisioner to constrain PVs by.
            - "--extra-create-metadata"
            - "--leader-election=true"
            - "--default-fstype=ext4"
            - "--timeout=60s"
            # Sidecar metrics (csi_sidecar_operations_seconds). Each sidecar in
            # this pod needs its own port; see docs/metrics.md for the map.
            - "--http-endpoint=:8081"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.11.0
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election=true"
            - "--timeout=60s"
            - "--http-endpoint=:8082"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election=true"
            - "--timeout=60s"
            - "--http-endpoint=:8083"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.1.0
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election=true"
            - "--timeout=60s"
            - "--http-endpoint=:8084"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.18.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--health-port=9808"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

      volumes:
        - name: socket-dir
          emptyDir: {}

