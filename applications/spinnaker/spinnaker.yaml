apiVersion: spinnaker.armory.io/v1alpha2
kind: SpinnakerService
metadata:
  name: spinnaker
  namespace: spinnaker
spec:
  kustomize:
    kayenta:
      deployment:
        patchesStrategicMerge:
        - |
          spec:
            template:
              spec:
                ## not really needed since we set below
                containers:
                  - name: kayenta
                    livenessProbe:
                      initialDelaySeconds: 160
  spinnakerConfig:
    config:
      armory:
        diagnostics:
          enabled: false
          logging:
            enabled: false
            endpoint: https://debug.armory.io/v1/logs
          uuid: jason-mcintosh-local
        terraform:
          enabled: true
      artifacts:
        github:
          accounts:
          - name: github-files-jm
            token: encrypted:k8s!n:artifact-creds!k:githubReadOnlyToken
            username: jasonmcintosh
          enabled: true
        gitrepo:
          accounts:
          - name: github-repo-clone-ro
            token: encrypted:k8s!n:artifact-creds!k:githubReadOnlyToken
            username: jasonmcintosh
          - name: github-repo-clone-ro-noauth
          enabled: true
        helm:
          accounts:
          - name: helm-hashicorp
            repository: https://helm.releases.hashicorp.com
          - name: helm-otel-collector
            repository: https://open-telemetry.github.io/opentelemetry-helm-charts
          enabled: true
        http:
          enabled: true
      canary:
        defaultMetricsAccount: local-prometheus
        defaultMetricsStore: prometheus
        defaultStorageAccount: minio
        enabled: true
        serviceIntegrations:
        - accounts:
          - accessKeyId: minio
            bucket: spinnaker
            endpoint: https://truenas.mcintosh.farm:9000
            name: minio
            rootFolder: canaries
            secretAccessKey: secretKey
            supportedTypes:
            - OBJECT_STORE
            - CONFIGURATION_STORE
          enabled: true
          name: aws
          s3Enabled: true
        - accounts:
          - endpoint:
              baseUrl: http://prometheus.monitoring:9090
            name: local-prometheus
            supportedTypes:
            - METRICS_STORE
          - endpoint:
              baseUrl: http://prometheus.monitoring:9090
            name: local-prometheus-2
            supportedTypes:
            - METRICS_STORE
          enabled: true
          name: prometheus
      deploymentEnvironment:
        customSizing:
          spin-clouddriver:
            limits:
              memory: 4Gi
            replicas: 2
          spin-echo:
            limits:
              memory: 3Gi
            replicas: 1
          spin-fiat:
            limits:
              memory: 2Gi
            replicas: 1
          spin-front50:
            limits:
              memory: 3Gi
            replicas: 2
          spin-gate:
            limits:
              memory: 2Gi
          spin-igor:
            limits:
              memory: 2Gi
          spin-kayenta:
            limits:
              memory: 2.5Gi
          spin-orca:
            limits:
              memory: 3Gi
          spin-rosco:
            limits:
              memory: 1Gi
          spin-terraformer:
            limits:
              memory: .5Gi
        initContainers:
          clouddriver:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          echo:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          fiat:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          front50:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          gate:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          igor:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          kayenta:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          orca:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          rosco:
          - command:
            - /bin/sh
            - -c
            - mkdir -p /opt/apmagent && cp /javaagent.jar /opt/apmagent/javaagent.jar
              && chmod 775 /opt/apmagent/*
            image: otel/autoinstrumentation-java:2.27.0
            imagePullPolicy: Always
            name: apm-initializer
            volumeMounts:
            - mountPath: /opt/apmagent
              name: shared-volume
          terraformer:
          - command:
            - /bin/sh
            - -c
            - echo "Copying files into the versions folder" && mkdir -p /terraform/versions/1.11.5-tofu
              && cp /bin/tofu /terraform/versions/1.11.5-tofu/terraform && chmod 755
              /terraform/versions/1.11.5-tofu/terraform
            image: scalr/opentofu:1.11.5
            name: opentofu
            volumeMounts:
            - mountPath: /terraform/versions
              name: terraformer-versions
        sidecars:
          clouddriver:
          - dockerImage: permitio/opal-client:latest
            env:
              OPAL_POLICY_SUBSCRIPTION_DIRS: applications/opa/
              OPAL_SERVER_URL: http://opa-opal-server:7002
            name: opal-client
            port: 8181
          front50:
          - dockerImage: permitio/opal-client:latest
            env:
              OPAL_POLICY_SUBSCRIPTION_DIRS: applications/opa/
              OPAL_SERVER_URL: http://opa-opal-server:7002
            name: opal-client
            port: 8181
          gate:
          - dockerImage: permitio/opal-client:latest
            env:
              OPAL_POLICY_SUBSCRIPTION_DIRS: applications/opa/
              OPAL_SERVER_URL: http://opa-opal-server:7002
            name: opal-client
            port: 8181
          orca:
          - dockerImage: permitio/opal-client:latest
            env:
              OPAL_POLICY_SUBSCRIPTION_DIRS: applications/opa/
              OPAL_SERVER_URL: http://opa-opal-server:7002
            name: opal-client
            port: 8181
      features:
        artifacts: true
        pipelineTemplates: true
      notifications:
        github-status:
          enabled: true
          token: encrypted:k8s!n:artifact-creds!k:githubReadOnlyToken
        slack:
          botName: SpinnakerNotifications
          enabled: true
          token: encrypted:k8s!n:notification-secrets!k:slack-bot-token
      persistentStorage:
        persistentStoreType: s3
      providers:
        dockerRegistry:
          enabled: true
        kubernetes:
          enabled: true
          primaryAccount: k8s-namespace-dev
      security:
        apiSecurity:
          overrideBaseUrl: https://spinnaker.mcintosh.farm/api/v1
          ssl:
            enabled: false
        authn:
          enabled: true
          oauth2:
            enabled: true
            provider: OTHER
        authz:
          enabled: true
          groupMembership:
            service: EXTERNAL
        uiSecurity:
          overrideBaseUrl: https://spinnaker.mcintosh.farm
          ssl:
            enabled: false
      stats:
        enabled: false
        instanceId: disable-echo-always-recreating
      telemetry:
        connectionTimeoutMillis: 3000
        enabled: true
        endpoint: https://stats.spinnaker.io
        instanceId: e20da5f8-286e-46c2-8d79-4c131d0707c4
        readTimeoutMillis: 5000
      timezone: America/Chicago
      version: 2.40.1
      webhook:
        trust:
          enabled: false
    profiles:
      clouddriver:
        cache-sharding:
          enabled: true
          heartbeatIntervalSeconds: 30
          replicaTtlSeconds: 60
        caching:
          sharding-enabled: true
        cats:
          pubsub:
            enabled: true
        credentials:
          poller:
            enabled: true
        docker-registry:
          accounts:
          - address: https://ghcr.io/
            name: docker-ghcr-jasonmcintosh
            password: encrypted:k8s!n:artifact-creds!k:githubPatToken
            repositories:
            - jasonmcintosh/spinnaker-work/demo-web-app
            username: jasonmcintosh
          - address: https://ghcr.io/
            name: docker-ghcr-spinnaker
            password: encrypted:k8s!n:artifact-creds!k:githubPatToken
            repositories:
            - spinnaker/clouddriver
            - spinnaker/deck
            - spinnaker/front50
            - spinnaker/echo
            - spinnaker/orca
            - spinnaker/fiat
            - spinnaker/rosco
            - spinnaker/igor
            - spinnaker/keel
            - spinnaker/kayenta
            - spinnaker/gate
            username: jasonmcintosh
          enabled: true
        kubernetes:
          accounts:
          - cacheIntervalSeconds: 60
            kubeconfigFile: encryptedFile:k8s!n:kubeconfig!k:kubeconfig
            kubectlExecutable: kubectl-1.29
            name: k8s-spinnaker-prod
            namespaces:
            - spinnaker
            permissions:
              READ:
              - everyone
              - engineering-managed
              WRITE:
              - everyone
              - engineering-managed
          - cacheIntervalSeconds: 60
            kubeconfigFile: encryptedFile:k8s!n:kubeconfig!k:kubeconfig
            kubectlExecutable: kubectl-1.29
            name: k8s-namespace-prod
            namespaces:
            - prod
            permissions:
              READ:
              - everyone
              - engineering-managed
              WRITE:
              - engineering-managed
          - cacheIntervalSeconds: 60
            kubeconfigFile: encryptedFile:k8s!n:kubeconfig!k:kubeconfig
            kubectlExecutable: kubectl-1.29
            name: k8s-namespace-dev
            namespaces:
            - dev
            permissions:
              READ:
              - everyone
              - engineering-managed
              WRITE:
              - everyone
              - engineering-managed
          - cacheIntervalSeconds: 60
            kubeconfigFile: encryptedFile:k8s!n:kubeconfig!k:kubeconfig
            kubernetesVersion: kubectl-1.29
            name: k8s-homelab
            permissions:
              READ:
              - engineering-managed
              WRITE:
              - engineering-managed
          loadNamespacesInAccount: false
          verifyAccountHealth: false
        proxmox:
          accounts:
          - insecure: true
            name: jm-lab
            password: yay4Linux
            server: 192.168.16.184
            userName: root@pam
          enabled: true
        redis:
          cache:
            enabled: false
          enabled: false
          scheduler:
            enabled: true
          taskRepository:
            enabled: false
        serviceLimits:
          cloudProviderOverrides:
            aws:
              rateLimit: 10
          implementationLimits:
            AmazonAutoScaling:
              defaults:
                rateLimit: 3
            AmazonElasticLoadBalancing:
              defaults:
                rateLimit: 5
        spring.data.redis.url: redis://valkey:6379
        sql:
          cache:
            enabled: true
          connectionPools:
            default:
              default: true
              jdbcUrl: jdbc:mysql://mysql:3306/clouddriver
              password: password
              user: root
          enabled: true
          migration:
            jdbcUrl: jdbc:mysql://mysql:3306/clouddriver
            password: password
            user: root
          scheduler:
            enabled: false
          table-namespace: v1
          taskRepository:
            enabled: true
          unknown-agent-cleanup-agent:
            enabled: true
        udf:
          defaultLegacyUdf: false
          enabled: true
          udfRoot: /opt/spinnaker/config/udf
      deck:
        settings-local.js: |
          window.spinnakerSettings.feature.kubernetesRawResources = true;
          window.spinnakerSettings.feature.kustomizeEnabled = true;
          window.spinnakerSettings.feature.artifactsRewrite = true;
          window.spinnakerSettings.feature.functions = true;
          window.spinnakerSettings.kubernetesAdHocInfraWritesEnabled = true;
          window.spinnakerSettings.authEnabled = true;
          window.spinnakerSettings.feature.terraform = true;
          window.spinnakerSettings.feature.managedServiceAccounts = true;
          window.spinnakerSettings.defaultProviders = ["proxmox","kubernetes"];
          window.spinnakerSettings.providers.proxmox = {};
      dinghy:
        Logging:
          Level: INFO
      echo:
        quiet-period:
          enabled: true
          endIso: "2025-05-28T21:00:00Z"
          startIso: "2025-02-09T21:00:00Z"
          suppressedTriggerTypes:
          - cron
          - webhook
          - git
          - concourse
          - jenkins
          - docker
          - pubsub
          - dryrun
          - pipeline
          - plugin
          - helm
          - manual
        resilience4j.circuitbreaker:
          instances:
            telemetry:
              registerHealthIndicator: false
        rest:
          enabled: false
          endpoints:
          - headers:
              Authorization: Splunk 1BD1BBDF-F7C2-4205-9113-427724465EDB
            template: '{"event":{{event}} }'
            url: https://splunk.mcintosh.farm/hec/services/collector/event?
            wrap: true
          insecure: false
        scheduler:
          enabled: true
          pipelineConfigsPoller:
            enabled: true
        sql:
          connectionPool:
            jdbcUrl: jdbc:mysql://mysql:3306/echo
            password: password
            user: root
          enabled: true
          migration:
            jdbcUrl: jdbc:mysql://mysql:3306/echo
            password: password
            user: root
      fiat:
        fiat:
          admin:
            roles:
            - engineering-managed
        permissions-repository:
          redis:
            enabled: false
          sql:
            async-pool-size: 20
            enabled: true
            max-query-concurrency: 20
            read-batch-size: 500
            write-batch-size: 500
        sql:
          connectionPools:
            default:
              jdbcUrl: jdbc:mysql://mysql:3306/fiat
              maxPoolSize: 10
              password: password
              user: root
          enabled: true
          migration:
            jdbcUrl: jdbc:mysql://mysql:3306/fiat
            password: password
            user: root
          retries:
            transactions:
              backoffMs: 50
              maxRetries: 3
      front50:
        spinnaker.s3.enabled: false
        sql:
          connectionPools:
            default:
              default: true
              jdbcUrl: jdbc:mysql://mysql:3306/front50
              password: password
              user: root
          enabled: true
          migration:
            jdbcUrl: jdbc:mysql://mysql:3306/front50
            password: password
            user: root
      gate:
        api-tokens:
          allowed-minting-roles:
          - engineering-managed
          enabled: true
        armory:
          cloud:
            enabled: false
        default:
          apiPort: 8085
        proxies:
        - id: terraform
          methods:
          - GET
          uri: http://spin-terraformer:7088
        saml:
          enabled: true
          issuerId: spinnaker
          metadataUrl: https://integrator-3395767.okta.com/app/exku1rxeyhJeP16iJ697/sso/saml/metadata
          metadataUrlKeycloak: http://192.168.16.167:8080/realms/master/protocol/saml/descriptor
          sign-requests: true
          signing-credentials:
          - certificate-location: encryptedFile:k8s!n:saml-signing-secret!k:certificate.pem
            private-key-location: encryptedFile:k8s!n:saml-signing-secret!k:private_key.pem
        server:
          servlet:
            context-path: /api/v1
            session:
              timeout: 86400
          tomcat:
            httpsServerPort: X-Forwarded-Port
            internalProxies: .*
            protocolHeader: X-Forwarded-Proto
            remoteIpHeader: X-Forwarded-For
        spinnaker:
          extensibility:
            deck-proxy:
              enabled: true
              plugins:
                Armory.EvaluateArtifactsPlugin:
                  enabled: true
                  version: 0.1.1
            plugins:
              Armory.ArmoryHeader:
                enabled: true
                version: 0.2.2
              Armory.InstanceRegistration:
                enabled: false
              Armory.ObservabilityPlugin:
                config.metrics:
                  prometheus:
                    enabled: false
                    meterRegistryConfig:
                      armoryRecommendedFiltersEnabled: false
                enabled: false
          services:
            redis:
              baseUrl: redis://valkey:6379
      igor:
        locking:
          enabled: true
        spinnaker:
          pollingSafeguard:
            itemUpperThreshold: 10000
      orca:
        executionRepository:
          compression:
            bodyCompressionThreshold: 1024
            compressionMode: read-write
            compressionType: ZLIB
            enabled: true
          redis:
            enabled: false
          sql:
            enabled: true
            pipelineRef:
              enabled: true
        monitor:
          activeExecutions:
            redis: false
        pollers:
          oldPipelineCleanup:
            enabled: true
            thresholdDays: 14
        sql:
          connectionPool:
            connectionTimeout: 5000
            jdbcUrl: jdbc:mysql://mysql:3306/orca
            maxLifetime: 30000
            maxPoolSize: 50
            password: password
            user: root
          enabled: true
          migration:
            jdbcUrl: jdbc:mysql://mysql:3306/orca
            password: password
            user: root
        tasks:
          useManagedServiceAccounts: true
        webhook:
          preconfigured:
          - customHeaders:
              Ce-Type: cd.artifact.packaged.v1
            description: Send to KNative a CDEvents
            enabled: true
            label: KNative Notification
            method: POST
            parameters:
            - description: The CdEvent is going to get this subject
              label: Subject for Event
              name: subject
              type: string
            - description: The URL to the execution id of the pipeline
              name: URL of requesting pipeline
              type: string
            - description: The context to make this make sense
              label: Context
              name: context
              type: string
            payload: |-
              {
                "id": "${parameterValues['subject']}",
                "url": "${parameterValues['url']}",
                "name": "${parameterValues['context']}"
              }
            type: knative
            url: https://localhost:8090/default/events-broker
      spinnaker:
        armory:
          policyEngine:
            failOpen: true
            opa:
              baseUrl: http://localhost:8181/v1/data
              enabled: true
              timeoutSeconds: 20
        artifact-store:
          enabled: false
          helm:
            expandOverrides: true
          s3:
            accessKey: minio
            bucket: spinnaker
            enabled: false
            region: us-east-1
            secretKey: secretKey
            url: https://truenas.mcintosh.farm:9000
          type: s3
        logging:
          level:
            com.amazonaws.latency: WARN
            com.netflix.spinnaker.clouddriver.cache: WARN
            com.netflix.spinnaker.clouddriver.kubernetes.OpaDeployDescriptionValidator: DEBUG
            com.netflix.spinnaker.okhttp.MetricsInterceptor: ERROR
            io.armory.spinnaker.front50.validator.validator.OpenPolicyAgentValidator: INFO
            root: INFO
        management:
          endpoints.web:
            exposure.include: '*'
        server:
          compression:
            enabled: true
            mime-types: text/html, text/xml, text/plain, text/css, text/javascript,
              application/javascript, application/json
            min-response-size: 4096
          http2:
            enabled: false
          max-http-header-size: 512KB
        spinnaker:
          extensibility:
            deck-proxy:
              enabled: true
      terraformer:
        redis:
          host: valkey
          port: 6379
    service-settings:
      clouddriver:
        env:
          JAVA_OPTS: -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch  -XX:MaxRAMPercentage=50.0
            -XX:+UnlockExperimentalVMOptions -XX:+UseZGC -Dotel.service.name=clouddriver-jasonmcintosh
            -javaagent:/opt/apmagent/javaagent.jar
          OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetrycollector:4318
          OTEL_INSTRUMENTATION_MICROMETER_ENABLED: true
        kubernetes:
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 7002
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 7002
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 7002
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          useExecHealthCheck: false
          volumes:
          - id: shared-volume
            mountPath: /opt/apmagent
            type: emptyDir
      deck:
        kubernetes:
          useExecHealthCheck: false
      dinghy:
        kubernetes:
          useExecHealthCheck: false
      echo:
        env:
          JAVA_OPTS: -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch  -XX:MaxRAMPercentage=75.0
            -XX:+UnlockExperimentalVMOptions -XX:+UseZGC  -Dotel.service.name=echo-jasonmcintosh
            -javaagent:/opt/apmagent/javaagent.jar
          OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetrycollector:4318
          OTEL_INSTRUMENTATION_MICROMETER_ENABLED: true
        kubernetes:
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8089
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8089
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 8089
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          useExecHealthCheck: false
          volumes:
          - id: shared-volume
            mountPath: /opt/apmagent
            type: emptyDir
      fiat:
        env:
          JAVA_OPTS: -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch -XX:MaxRAMPercentage=75.0
            -XX:+UnlockExperimentalVMOptions -XX:+UseZGC  -Dotel.service.name=fiat-jasonmcintosh
            -javaagent:/opt/apmagent/javaagent.jar
          OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetrycollector:4318
          OTEL_INSTRUMENTATION_MICROMETER_ENABLED: true
        kubernetes:
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 7003
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 7003
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 230
            httpGet:
              path: /health
              port: 7003
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          useExecHealthCheck: false
