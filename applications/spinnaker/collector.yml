apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: spinnaker
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      # All forwarding destinations (ClickHouse, Prometheus, New Relic, Honeycomb) now live
      # in exactly one place: otel-gateway's ConfigMap (applications/monitoring/collector-
      # gateway.yaml). This collector only owns the OTLP receiver apps send to and the
      # edge-side trace sampling below, and forwards everything over OTLP.
      otlp:
        endpoint: otel-gateway.monitoring:4317
        tls:
          insecure: true
    processors:
      ## Reduce data... we just have too much in spinnaker at thi stime.
      probabilistic_sampler/trace:
        sampling_percentage: 10 # Sample 10% of traces
      batch:
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [probabilistic_sampler/trace, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetrycollector
  namespace: spinnaker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetrycollector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetrycollector
    spec:
      containers:
      - name: otelcol
        args:
        - --config=/conf/collector.yaml
        image: otel/opentelemetry-collector-contrib:0.145.0
        volumeMounts:
        - mountPath: /conf
          name: collector-config
      volumes:
      - configMap:
          items:
          - key: collector.yaml
            path: collector.yaml
          name: collector-config
        name: collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetrycollector
  namespace: spinnaker
spec:
  ports:
  - name: http-protobuff
    port: 4318
    protocol: TCP
    targetPort: 4318
  selector:
    app.kubernetes.io/name: opentelemetrycollector
  type: ClusterIP
