apiVersion: v1
kind: ConfigMap
metadata:
  name: ilo-collector-config
  namespace: monitoring
data:
  collector.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
          - job_name: 'ilo-collector'
            scrape_timeout: 180s
            scrape_interval: 900s
            static_configs:
            - targets: 
              ## Host1 & 2
              - 192.168.19.60
              - 192.168.18.128
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_host
              - source_labels: [__param_host]
                target_label: instance
              - target_label: __address__
                replacement: ilo-prometheus:9545
    exporters:
      # All forwarding destinations (ClickHouse, Prometheus, etc.) now live in exactly one
      # place: otel-gateway's ConfigMap (collector-gateway.yaml). This collector only owns
      # the ilo-specific scrape/relabel logic above and forwards everything over OTLP.
      otlp:
        endpoint: otel-gateway.monitoring:4317
        tls:
          insecure: true
    processors:
      batch:
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilo-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetrycollector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetrycollector
    spec:
      containers:
      - name: otelcol
        args:
        - --config=/conf/collector.yaml
        image: otel/opentelemetry-collector-contrib:0.138.0
        volumeMounts:
        - mountPath: /conf
          name: ilo-collector-config
      volumes:
      - configMap:
          items:
          - key: collector.yaml
            path: collector.yaml
          name: ilo-collector-config
        name: ilo-collector-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilo-prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ilo-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ilo-prometheus
    spec:
      containers:
      - name: otelcol
        image: mauvesoftware/ilo_exporter:latest
        envFrom:
        - secretRef:
            name: ilocredentials
---
apiVersion: v1
kind: Service
metadata:
  name: ilo-prometheus
  namespace: monitoring
spec:
  ports:
  - name: http
    port: 9545
    protocol: TCP
    targetPort: 9545
  selector:
    app.kubernetes.io/name: ilo-prometheus
  type: ClusterIP
