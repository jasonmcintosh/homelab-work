apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: spinnaker
  name: mariadb
  namespace: spinnaker-oss
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/part-of: spinnaker
  serviceName: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/part-of: spinnaker
    spec:
      containers:
      - env:
        - name: MARIADB_ROOT_PASSWORD
          value: testing123
        - name: clouddriver
          value: testing123
        - name: echo
          value: testing123
        - name: fiat
          value: testing123
        - name: front50
          value: testing123
        - name: orca
          value: testing123
        image: mariadb:latest
        name: mariadb
        ports:
        - containerPort: 3306
          name: traffic-port
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          initialDelaySeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /etc/mysql/mariadb.conf.d
          name: config
        - mountPath: /docker-entrypoint-initdb.d/init.sh
          name: init
          subPath: init.sh
        - mountPath: /var/lib/mysql
          name: mariadb
      securityContext:
        fsGroup: 10111
        runAsGroup: 10111
        runAsNonRoot: true
        runAsUser: 10111
      volumes:
      - configMap:
          items:
          - key: config.cnf
            path: config.cnf
          name: mariadb
        name: config
      - configMap:
          defaultMode: 493
          items:
          - key: init.sh
            path: init.sh
          name: mariadb
        name: init
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/part-of: spinnaker
      name: mariadb
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
