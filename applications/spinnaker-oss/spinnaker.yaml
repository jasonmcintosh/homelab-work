    #  useSharedManagedServiceAccounts: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: orca
    app.kubernetes.io/part-of: spinnaker
  name: orca-gtdc5mdtc6
  namespace: spinnaker-oss
---
apiVersion: v1
data:
  orca.yml: |
    sql:
      enabled: true
      connectionPools:
        default:
          default: true
          # additional connection pool parameters are available here,
          # for more detail and to view defaults, see:
          # https://github.com/spinnaker/kork/blob/master/kork-sql/src/main/kotlin/com/netflix/spinnaker/kork/sql/config/ConnectionPoolProperties.kt
          jdbcUrl: jdbc:mysql://mariadb:3306/orca
          user: orca_service
          password: ${ORCA_MARIADB}
          connectionTimeout: 5000
          maxLifetime: 30000
          # MariaDB-specific:
          maxPoolSize: 50
      migration:
        jdbcUrl: jdbc:mysql://mariadb:3306/orca
        user: orca_migrate
        password: ${ORCA_MARIADB}

    # Ensure we're only using SQL for accessing execution state
    executionRepository:
      sql:
        enabled: true
      redis:
        enabled: false

    # Reporting on active execution metrics will be handled by SQL
    monitor:
      activeExecutions:
        redis: false

    # Don't use SQL for Orca's work queue due to reported Zombie pipelines
    keiko:
      queue:
        sql:
          enabled: false
        # In Redis component we enable redis
        # redis:
        #   enabled: false

    queue:
      zombieCheck:
        enabled: true
      pendingExecutionService:
        # In Redis component we enable redis
        sql:
          enabled: false
        # redis:
        #   enabled: false
