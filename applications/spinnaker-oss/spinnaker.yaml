          exec:
            command:
            - redis-cli
            - ping
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /data
          name: redis
      volumes:
      - configMap:
          items:
          - key: redis.conf
            path: redis.conf
          name: redis
        name: config
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: spinnaker
      name: redis
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
